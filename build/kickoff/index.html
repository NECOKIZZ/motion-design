(function () {
  // ───────────── timing: measured beat grid (npx hyperframes beats) ─────────────
  const BEATS = [0.096,0.592,1.104,1.6,2.096,2.592,3.104,3.6,4.096,4.592,5.104,5.6,6.096,6.592,7.104,7.6,8.096,8.608,9.104,9.6,10.096,10.592,11.104,11.6,12.096,12.592,13.104,13.6,14.096,14.592,15.104,15.6,16.096,16.592,17.104,17.6,18.096,18.592,19.104,19.6,20.096,20.592,21.104,21.6,22.112,22.592,23.104,23.6,24.112,24.608,25.104,25.6,26.096,26.592,27.104,27.6,28.096,28.592,29.104,29.6];

  // ───────────── builders ─────────────
  function makeBall(parent) {
    const b = el("div", "ball", parent);

  // a ball of diameter d inside a wrapper sized d: build at 200 and scale the wrapper's child

    s.style.scale = String(d / 200);
    return makeBall(s);

  const KPATH = "M150 0L500 502H327.5L150 251.5V500H0V0H150Z";
  function makeK3D(parent, w, h, faceColor) {
    const layers = 14;
    for (let i = layers; i >= 1; i--) {

  const SWAP2 = LAND1 + 0.4;
  tl.set("#hero", { visibility: "hidden" }, SWAP2);
  init(s2LBallWrap, { opacity: 0 }, 0);
  tl.set(s2LBallWrap, { opacity: 1 }, SWAP2);

  // ═════ FRAME 2 · Turn (C1 → C2) ═════
  ft(0, "#s2-k3d", { rotationY: -70, rotationX: 12, z: -300, filter: "blur(8px)" }, { rotationY: -8, rotationX: 0, z: 0, filter: "blur(0px)", duration: 1.0, ease: "expo.out" }, C1);
  ft(0, "#s2-ghostk", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 2.0, ease: "power2.out" }, C1);
  ft(0, "#s2-ghostk", { rotation: 0 }, { rotation: -3, duration: 4, ease: "none" }, C1);
  ft(0, "#s2-streak", { x: -600, opacity: 0 }, { x: 600, opacity: 1, duration: 0.6, ease: "power2.out" }, P(1, 2));
  ft(0, "#s2-streak", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, P(1, 2) + 0.4);
  ft(0, s2Shine, { x: -160 }, { x: 340, duration: 0.8, ease: "power2.inOut" }, P(1, 2) + 0.1);
  ft(0, nameLetters, { yPercent: 112 }, { yPercent: 0, duration: 0.6, ease: "expo.out", stagger: 0.04 }, P(1, 2));
  exitUp(nameLetters, P(1, 4));
  ft(0, "#s2-logo", { x: 0, scale: 1 }, { x: -280, scale: 0.73, duration: 0.5, ease: "power3.inOut" }, P(1, 4));
  maskRise(s2L1.words, P(1, 4) + 0.1);
  maskRise(s2L2.words, P(1, 5));
  glowWord(s2L2, P(1, 5) + 0.05);
  const CAM2END = C2 - 0.5;
  ft(0, "#s2-world", { scale: 1 }, { scale: 1.03, duration: CAM2END - C1, ease: "none" }, C1);

  // ═════ cut 2 · dive into the ball ═════
  // logo ball after reflow: logo centre (700,500) moved −280 and scaled .73; ball offset (89.7,−90.2)
  const bx0 = 700 - 280 + 89.7 * 0.73, by0 = 500 - 90.2 * 0.73;
  const bx = 960 + (bx0 - 960) * 1.03, by = 540 + (by0 - 540) * 1.03, bd = 119.6 * 0.73 * 1.03;
  const DIVE = C2 - 0.45;
  tl.set("#hero", { visibility: "visible" }, DIVE);
  tl.set(s2LBallWrap, { opacity: 0 }, DIVE);
  tl.set("#hero-pos", { x: bx - 100, y: by - 100 }, DIVE);
  tl.set("#hero-scale", { scale: bd / 200 }, DIVE);
  tl.set("#hero-squash", { rotation: 0 }, DIVE);
  init("#s2-dive", { transformOrigin: `${bx}px ${by}px` }, 0);
  ft(0, "#s2-dive", { scale: 1 }, { scale: 2.4, duration: 0.45, ease: "power2.in" }, DIVE);
  ft(0, "#hero-pos", { x: bx - 100, y: by - 100 }, { x: 860, y: 440, duration: 0.45, ease: "power2.in" }, DIVE);
  ft(0, "#hero-scale", { scale: bd / 200 }, { scale: 16, duration: 0.45, ease: "power2.in" }, DIVE);
  hide(C2 + 0.02, "#s2");
  show(C2, "#s3");
  // shrink into Frame 3's ball
  ft(0, "#hero-pos", { x: 860, y: 440 }, { x: CX - 100, y: CY - 100, duration: 0.6, ease: "expo.out" }, C2);
  ft(0, "#hero-scale", { scale: 16 }, { scale: 1, duration: 0.6, ease: "expo.out" }, C2);
  const SWAP3 = C2 + 0.62;
  tl.set("#hero", { visibility: "hidden" }, SWAP3);
  init(s3BallWrap, { opacity: 0 }, 0);
  tl.set(s3BallWrap, { opacity: 1 }, SWAP3);

  // ═════ FRAME 3 · the result and the pack (C2 → C3) ═════
  init([dL, dR], { y: 0 }, 0);
  init(tick, { opacity: 0 }, 0);
  ft(0, tick, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, SWAP3 - 0.1);
  ft(0, dL, { y: 0 }, { y: -64, duration: 0.18, ease: "power3.out" }, P(2, 1));
  ft(0, dL, { y: -64 }, { y: -128, duration: 0.18, ease: "power3.out" }, P(2, 1) + 0.2);
  ft(0, dR, { y: 0 }, { y: -64, duration: 0.2, ease: "power3.out" }, P(2, 1) + 0.42);
  ft(0, s3Pulse, { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, P(2, 1) + 0.42);
  ft(0, "#s3-ghost", { opacity: 0, scale: 1.2 }, { opacity: 0.07, scale: 1, duration: 1.2, ease: "power2.out" }, P(2, 1));
  ft(0, ringEls, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power2.out", stagger: 0.1 }, P(2, 2));
  maskRise(s3H1[0].words, P(2, 3)); maskRise(s3H1[1].words, P(2, 3) + 0.12);
  glowWord(s3H1[1], P(2, 3) + 0.2);
  init(TILES.map((t) => t.inn), { opacity: 0 }, 0);
  const tileIn = [
    [0, P(2, 4), "dock"], [1, P(2, 4) + 0.25, "depth"], [2, P(2, 4) + 0.45, "float"], [3, P(2, 4) + 0.65, "depth"], [4, P(2, 4) + 0.85, "floatDown"],
  ];
  tileIn.forEach(([i, t, kind]) => {
    const T = TILES[i];
    if (kind === "dock" || kind === "depth") {
      ft(0, T.inn, { opacity: 0, scale: 0.55, z: -600, y: kind === "dock" ? -40 : -20, x: kind === "dock" ? 0 : -60 }, { opacity: 1, scale: 1, z: 0, y: 0, x: 0, duration: 0.7, ease: "expo.out" }, t);
    } else {
      ft(0, T.inn, { opacity: 0, y: kind === "float" ? 90 : -90, rotationX: kind === "float" ? 18 : -18 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.8, ease: "expo.out" }, t);
    }
    ft(0, T.glass, { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.6, ease: "power2.out" }, t);
    shinePass(T.shine, 200, t + 0.2, 0.6);
  });
  ft(0, s3Pulse, { scale: 1 }, { scale: 1.05, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, P(2, 4) + 0.55);
  ft(0, ringEls[0], { borderColor: "rgba(123,98,246,0.34)" }, { borderColor: "rgba(255,255,255,1)", duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, P(2, 4) + 0.55);
  glint(s3TileGlint, P(2, 4) + 0.65, 0.8);
  // bob (offset phases)
  TILES.forEach((T, i) => {
    const st = P(2, 7) + i * 0.13, dur = C4 + 0.2 - st;
    ft(0, T.bob, { y: 0 }, { y: i % 2 ? 4 : -4, duration: 1.0 + i * 0.07, ease: "sine.inOut", yoyo: true, repeat: finiteRepeat(dur, 1.0 + i * 0.07) }, st);
  });
  // ball breath
  ft(0, s3Ball.querySelector(".b-glow"), { scale: 1 }, { scale: 1.08, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 5 }, P(2, 6));
  // camera orbit
  ft(0, "#s3-field", { rotationX: 0, rotationY: 0, scale: 1 }, { rotationX: 8, rotationY: -6, scale: 1, duration: C3 - C2, ease: "power2.inOut" }, C2);

  // ═════ FRAME 4 · the median gate (C3 → C4) ═════
  init(["#s3-median", "#s3-median-rim"], { opacity: 0, scale: 100 / 280 }, 0);
  ft(0, ["#s3-median", "#s3-median-rim"], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, C3);
  ft(0, ["#s3-median", "#s3-median-rim"], { scale: 100 / 280 }, { scale: 1, duration: 1.6, ease: "power3.inOut" }, C3);
  ft(0, "#s3-rim-i", { rotation: 0 }, { rotation: 360, duration: 1.6, ease: "none" }, C3 + 0.1);
  // losers frost (nearest first)
  [2, 3, 4].forEach((i, k) => {
    const T = TILES[i], t = P(3, 4) + k * 0.08;
    ft(0, T.state, { scale: 1, opacity: 1 }, { scale: 0.8, opacity: 0.45, duration: 0.6, ease: "power2.inOut" }, t);

    const T = TILES[i];

  });
  exitUp([...s3H1[0].words, ...s3H1[1].words], P(3, 4) + 0.1);
  maskRise(s3H2[0].words, P(3, 5)); maskRise(s3H2[1].words, P(3, 5) + 0.12);
  glowWord(s3H2[1], P(3, 5) + 0.2);
  ft(0, "#s3-median", { boxShadow: "0 0 18px rgba(123,98,246,0.9), inset 0 0 18px rgba(123,98,246,0.6)" }, { boxShadow: "0 0 38px rgba(123,98,246,1), inset 0 0 30px rgba(123,98,246,0.8)", duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, P(3, 6));
  ft(0, "#s3-field", { rotationX: 8, rotationY: -6, scale: 1 }, { rotationX: 4, rotationY: 0, scale: 1.08, duration: C4 - C3, ease: "power2.inOut" }, C3);

  // ═════ cut 4 · ring wipe on the drop ═════
  const W4 = C4 - 0.4, W4D = 0.55;
  ft(0, ["#s3-median", "#s3-median-rim"], { scale: 1 }, { scale: 6, duration: W4D, ease: "power2.in" }, W4);
  [2, 3, 4].forEach((i) => {
    const T = TILES[i], dx = T.x - CX, dy = T.y - CY;

  });
  show(W4, "#s5");
  ft(0, "#s5", { clipPath: "circle(302px at 1160px 540px)" }, { clipPath: "circle(1814px at 1160px 540px)", duration: W4D, ease: "power2.in" }, W4);
  hide(C4 + 0.2, "#s3");

  // ═════ FRAME 5 · peak (C4 → C5) ═════
  ft(0, "#s5-settle", { scale: 1.1 }, { scale: 1, duration: 0.6, ease: "expo.out" }, C4);
  STACKS.forEach((st, si) => {
    // hidden discs above n0
    init(st.discs.slice(st.n0), { opacity: 0 }, 0);
    init(st.tileRide, { y: tileYOnTop(st.n0) - tileYOnTop(st.n1) }, 0);
    init(st.pctWrap, { opacity: 0 }, 0);
    ft(0, st.in, { z: -600, scale: 0.7, opacity: 0, filter: "blur(14px)" }, { z: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, C4 + 0.05 + si * 0.06);
    const rise = si === 0 ? P(4, 2) : P(4, 2) + 0.1;
    const nNew = st.n1 - st.n0, per = si === 0 ? 0.06 : 0.05;
    ft(0, st.discs.slice(st.n0), { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.4)", stagger: per }, rise);
    ft(0, st.tileRide, { y: tileYOnTop(st.n0) - tileYOnTop(st.n1) }, { y: 0, duration: per * (nNew - 1) + 0.35, ease: "power2.out" }, rise);
    ft(0, st.discs.map((d) => d.glow), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out", stagger: per }, rise + 0.15);
    // count up
    const pt = si === 0 ? P(4, 4) : P(4, 4) + 0.2, pd = si === 0 ? 1.0 : 0.6;
    ft(0, st.pctWrap, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, pt);
    const proxy = { v: 0 };
    tl.fromTo(proxy, { v: 0 }, { v: st.pct, duration: pd, ease: "power2.out", immediateRender: false, onUpdate: () => { st.pctEl.textContent = "+" + Math.round(proxy.v) + "%"; } }, pt);
    ft(0, st.pctGlow, { opacity: 0, scale: 0.7 }, { opacity: 0.6, scale: 1, duration: 0.6, ease: "power2.out" }, pt + pd);
    shinePass(st.tshine, 200, pt + pd - 0.1, 0.6);
    // bob
    ft(0, st.bob, { y: 0 }, { y: si ? -3 : 3, duration: 1.1 + si * 0.2, ease: "sine.inOut", yoyo: true, repeat: finiteRepeat(C5 + 0.2 - P(4, 7), 1.1 + si * 0.2) }, P(4, 7) + si * 0.15);
  });
  // far pack drifting away
  farEls.forEach((f, i) => ft(0, f, { x: 0, y: 0, opacity: 1 }, { x: [-80, -60, 90][i], y: [-40, 50, -40][i], opacity: 0.5, duration: C5 - C4, ease: "none" }, C4));
  // streams
  init(caps.map((c) => c.c), { opacity: 0 }, 0);
  caps.forEach((cp, i) => {
    const t = P(4, 1) + i * 0.03;
    init(cp.c, { rotation: cp.ang }, 0);
    ft(0, cp.c, { x: 0 }, { x: cp.dx, duration: 1.0, ease: "power2.inOut" }, t);
    ft(0, cp.c, { y: 0 }, { y: cp.dy, duration: 1.0, ease: "power3.in" }, t);
    ft(0, cp.c, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
    ft(0, cp.c, { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.in" }, t + 0.85);
  });
  // punch-in
  ft(0, "#s5-cam", { scale: 1, rotationY: 4 }, { scale: 1.08, rotationY: 2, duration: 0.25, ease: "expo.out" }, P(4, 2));
  ft(0, "#s5-cam", { scale: 1.08, rotationY: 2 }, { scale: 1.02, rotationY: 0, duration: 1.2, ease: "power2.inOut" }, P(4, 2) + 0.25);
  // shine up the stack + glints
  ft(0, s5Shine, { y: 480 }, { y: -160, duration: 0.7, ease: "power2.inOut" }, P(4, 5));
  glint(s5Glints[0], P(4, 5) + 0.3, 1); glint(s5Glints[1], P(4, 5) + 0.42, 0.7); glint(s5Glints[2], P(4, 5) + 0.5, 0.5);
  maskRise(s5H[0].words, P(4, 6)); maskRise(s5H[1].words, P(4, 6) + 0.12);
  glowWord(s5H[1], P(4, 6) + 0.15);

  // ═════ cut 5 · ring ripple from the top disc ═════
  const W5 = C5 - 0.3;
  show(W5, "#s6");
  ft(0, "#s6", { clipPath: "circle(0px at 1300px 586px)" }, { clipPath: "circle(2000px at 1300px 586px)", duration: 0.55, ease: "power2.in" }, W5);
  hide(C5 + 0.3, "#s5");
  init("#wipe5", { scale: 0, opacity: 0 }, 0);
  ft(0, "#wipe5", { scale: 0, opacity: 1 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power2.in" }, W5);
  ft(0, "#wipe5", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power2.out" }, W5 + 0.55);

  // ═════ FRAME 6 · trust (C5 → C6) ═════
  ft(0, "#s6-ghost", { opacity: 0, x: 80 }, { opacity: 0.07, x: 0, duration: 1.5, ease: "power2.out" }, C5);
  ft(0, "#s6-ghost", { x: 0 }, { x: -60, duration: C6 - C5 - 1.5, ease: "none" }, C5 + 1.5);
  init(PANELS.map((p) => p.inn), { opacity: 0 }, 0);
  const pin = [P(5, 1), P(5, 2) + 0.1, P(5, 3) + 0.2];
  PANELS.forEach((pn, i) => {
    const t = pin[i];
    if (i === 1) ft(0, pn.inn, { opacity: 0, z: -500, scale: 0.8 }, { opacity: 1, z: 0, scale: 1, duration: 0.8, ease: "expo.out" }, t);
    else ft(0, pn.inn, { opacity: 0, y: i === 0 ? 90 : -90, rotationX: i === 0 ? 18 : -18 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.9, ease: "expo.out" }, t);
    ft(0, pn.fold, { rotationY: pn.ry }, { rotationY: pn.ry * 0.4, duration: 1.2, ease: "power3.out" }, t);
    if (i === 0) {
      ft(0, pn.draw, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, t + 0.2);
      ft(0, pn.dots, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.06 }, t + 0.5);
    } else if (i === 1) {
      ft(0, pn.draw, { strokeDasharray: "0 1" }, { strokeDasharray: "0.1 1", duration: 0.5, ease: "power2.out" }, t + 0.3);
    } else {
      ft(0, pn.dots, { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.03 }, t + 0.3);
    }

    glint(pn.glint, P(5, 5) + 0.3 + i * 0.25, [1, 0.7, 0.5][i]);
    ft(0, pn.bob, { y: 0 }, { y: i === 1 ? -3 : 3, duration: 1.2 + i * 0.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, P(5, 6) + i * 0.1);
  });
  ft(0, "#s6-world", { x: 20, rotationY: 2 }, { x: -20, rotationY: -2, duration: C6 - C5, ease: "none" }, C5);
  init(PANELS[0].dots, { scale: 0 }, 0); init(PANELS[2].dots, { scale: 0 }, 0);

  // ═════ cut 6 · collapse into the ball ═════
  const COL = C6 - 0.6;
  PANELS.forEach((pn, i) => {
    ft(0, pn.fold, { x: 0, scale: 1 }, { x: 960 - pn.x, scale: 0.05, duration: 0.45, ease: "power2.in" }, COL + i * 0.04);
  });
  ft(0, "#s6-bg", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.inOut" }, COL);
  hide(C6 + 0.1, "#s6");
  show(C6 - 0.2, "#s7");
  const L7 = { x: 1031.7, y: 307.8, d: 95.6 };
  const APP = C6 - 0.22, LAND7 = C6 + 0.35;
  tl.set("#hero", { visibility: "visible" }, APP);
  tl.set("#hero-pos", { x: 860, y: 440 }, APP);
  tl.set("#hero-squash", { rotation: 0, scaleX: 1, scaleY: 1 }, APP);
  ft(0, "#hero-scale", { scale: 0.05 }, { scale: 0.6, duration: 0.15, ease: "power2.out" }, APP);

  ft(0, "#hero-pos", { x: 860 }, { x: L7.x - 100, duration: LAND7 - APP - 0.15, ease: "power3.inOut" }, APP + 0.15);
  ft(0, "#hero-pos", { y: 440 }, { y: L7.y - 100, duration: LAND7 - APP - 0.15, ease: "power3.inOut" }, APP + 0.15);

  ft(0, "#hero-scale", { scale: (L7.d / 200) * 1.08 }, { scale: L7.d / 200, duration: 0.35, ease: "back.out(1.4)" }, LAND7);

  // ═════ FRAME 7 · sign-off (C6 → END) ═════
  ft(0, "#s7-k3d", { rotationY: 60, z: -400, filter: "blur(8px)", opacity: 0 }, { rotationY: -8, z: 0, filter: "blur(0px)", opacity: 1, duration: 0.9, ease: "expo.out" }, C6);

  ft(0, "#s7-ring", { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power2.out" }, LAND7);

  window.__timelines["main"] = tl;
})();
