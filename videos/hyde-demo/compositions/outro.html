<!doctype html>

  <body>
    <template>
      <style>

        #o-grid { position: absolute; inset: 0; opacity: 0.5;
          background-image: linear-gradient(rgba(155,123,255,0.07) 1px, rgba(155,123,255,0) 1px), linear-gradient(90deg, rgba(155,123,255,0.07) 1px, rgba(155,123,255,0) 1px);
          background-size: 60px 60px; }

        .head { position: absolute; left: 80px; right: 80px; font-weight: 900; letter-spacing: -0.045em; line-height: 1.02; }
        .head .w { display: inline-block; }
        .head .v { color: #9b7bff; }
        #o-h1 { top: 760px; font-size: 120px; text-align: center; }
        #o-h2 { top: 300px; font-size: 96px; }
        #o-h2b { top: 1090px; font-size: 52px; font-weight: 800; letter-spacing: -0.02em; color: #d9d4f5; }

        /* the private balance */
        #bal { position: absolute; left: 80px; width: 920px; top: 560px; height: 420px; border-radius: 36px; padding: 44px 48px;
          background: rgba(22,23,40,0.92); box-shadow: 0 0 0 2px rgba(155,123,255,0.45), 0 40px 100px rgba(0,0,0,0.5), 0 0 80px rgba(155,123,255,0.18); }
        #bal .lbl { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.14em; color: #9b7bff; }
        #bal .num { margin-top: 22px; font-weight: 900; font-size: 150px; letter-spacing: -0.05em; line-height: 1; }
        #bal .num small { font-size: 52px; letter-spacing: -0.02em; color: #b9b2e0; margin-left: 14px; }
        #bal .only { margin-top: 30px; font-family: "JetBrains Mono", monospace; font-size: 26px; color: #b9b2e0; }
        #bal .shine { position: absolute; inset: 0; border-radius: 36px; overflow: hidden; }
        #bal .shine i { position: absolute; top: -40px; bottom: -40px; width: 120px; left: -200px; background: rgba(255,255,255,0.08); transform: skewX(-20deg); }

        #chains { position: absolute; left: 80px; right: 80px; top: 1200px; display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
        .chip { padding: 20px 30px; border-radius: 40px; font-weight: 800; font-size: 40px; letter-spacing: -0.02em; background: #15162a; box-shadow: 0 0 0 2px rgba(238,235,255,0.35); }
        .chip.sol { background: #9b7bff; color: #0a0b14; box-shadow: none; }

        /* payroll */
        #pay { position: absolute; left: 80px; width: 920px; top: 520px; border-radius: 36px; padding: 28px 36px 36px;
          background: rgba(22,23,40,0.92); box-shadow: 0 0 0 2px rgba(155,123,255,0.45), 0 40px 100px rgba(0,0,0,0.5); }
        #pay .lbl { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: 0.14em; color: #9b7bff; margin: 6px 0 14px; }
        .prow { position: relative; display: flex; align-items: center; height: 104px; border-top: 2px solid rgba(238,235,255,0.08); }
        .prow .nm { font-weight: 800; font-size: 40px; letter-spacing: -0.02em; width: 260px; }
        .prow .ch { font-family: "JetBrains Mono", monospace; font-size: 28px; color: #b9b2e0; width: 250px; }
        .prow .am { margin-left: auto; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 34px; }
        .prow .ok { width: 46px; height: 46px; margin-left: 22px; border-radius: 50%; background: #9b7bff; color: #0a0b14; font-weight: 900; font-size: 30px;
          display: flex; align-items: center; justify-content: center; }
        #more { margin-top: 18px; font-family: "JetBrains Mono", monospace; font-size: 28px; color: #b9b2e0; }
        #more b { color: #eeebff; }
        #run { position: absolute; left: 80px; width: 920px; top: 1330px; height: 120px; border-radius: 30px; background: #9b7bff; color: #0a0b14;
          display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 48px; letter-spacing: -0.02em; box-shadow: 0 10px 0 #6c4fd6, 0 0 60px rgba(155,123,255,0.5); }
        #run-note { position: absolute; left: 0; right: 0; top: 1500px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 30px; color: #d9d4f5; }

        /* lockup (rhymes with the intro) */
        #o-lock { position: absolute; left: 0; right: 0; top: 640px; height: 700px; }
        #ol-mark { position: absolute; left: 50%; top: 0; width: 200px; height: 210px; margin-left: -100px; }
        #ol-mark i { position: absolute; top: 0; width: 52px; height: 210px; border-radius: 12px; background: #eeebff; }
        #ol-mark i.l { left: 0; } #ol-mark i.r { right: 0; }
        #ol-mark b { position: absolute; left: -22px; right: -22px; top: 78px; height: 54px; border-radius: 12px; background: #9b7bff; box-shadow: 0 0 44px rgba(155,123,255,0.75); }
        #ol-word { position: absolute; left: 0; right: 0; top: 240px; text-align: center; font-weight: 900; font-size: 210px; letter-spacing: -0.05em; line-height: 1; }
        #ol-tag { position: absolute; left: 0; right: 0; top: 480px; text-align: center; font-weight: 800; font-size: 54px; letter-spacing: -0.02em; }
        #ol-tag span { color: #9b7bff; }
        #ol-chip { position: absolute; left: 50%; top: 580px; width: 620px; margin-left: -310px; text-align: center; padding: 16px 0; border-radius: 40px;
          font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; color: #d9d4f5; box-shadow: 0 0 0 2px rgba(155,123,255,0.5); }
        #ol-foot { position: absolute; left: 0; right: 0; top: 1640px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 26px; color: #8d86b3; }
      </style>

      <div id="root" data-composition-id="outro" data-width="1080" data-height="1920">
        <div id="o-iris">
          <div id="o-grid"></div>
          <div id="o-glow"></div>

          <div id="o-h1" class="head"><span class="w">Solana</span> <span class="w">is just</span> <span class="w v">the start.</span></div>

          <div id="o-h2" class="head"><span class="w">One</span> <span class="w">private</span> <span class="w v">balance.</span></div>
          <div id="bal">
            <div class="lbl">HYDE VAULT · PRIVATE BALANCE</div>
            <div class="num"><span id="bal-n">12,480.00</span><small>USDC</small></div>
            <div class="only">visible only to you</div>
            <div class="shine"><i></i></div>
          </div>
          <div id="o-h2b" class="head">Spendable on 7 chains:</div>
          <div id="chains">
            <div class="chip">Ethereum</div><div class="chip">Arbitrum</div><div class="chip">Optimism</div><div class="chip">Polygon</div>
            <div class="chip">Avalanche</div><div class="chip">Base</div><div class="chip sol">Solana</div>
          </div>

          <div id="o-h3" class="head" style="top: 300px; font-size: 96px"><span class="w">Private</span> <span class="w v">payroll.</span></div>
          <div id="pay">
            <div class="lbl">OCTOBER PAYROLL · 25 PEOPLE · 1 REQUEST</div>
            <div class="prow" id="p0"><span class="nm">Ada</span><span class="ch">Base</span><span class="am">950.50</span><span class="ok">✓</span></div>
            <div class="prow" id="p1"><span class="nm">Kemi</span><span class="ch">Arbitrum</span><span class="am">1,200.00</span><span class="ok">✓</span></div>
            <div class="prow" id="p2"><span class="nm">Tolu</span><span class="ch">Solana</span><span class="am">800.00</span><span class="ok">✓</span></div>
            <div class="prow" id="p3"><span class="nm">Femi</span><span class="ch">Polygon</span><span class="am">1,100.00</span><span class="ok">✓</span></div>
            <div class="prow" id="p4"><span class="nm">Zara</span><span class="ch">Ethereum</span><span class="am">1,450.00</span><span class="ok">✓</span></div>
            <div id="more"><b>+ 20 more</b> · each on the chain they prefer</div>
          </div>
          <div id="run">Run payroll</div>
          <div id="run-note">exact pay · nothing links them to you</div>

          <div id="o-lock">
            <div id="ol-mark"><i class="l"></i><i class="r"></i><b></b></div>
            <div id="ol-word">Hyde</div>
            <div id="ol-tag">Private payments, <span>on any chain.</span></div>
            <div id="ol-chip">a plugin for PayBox agents</div>
          </div>
          <div id="ol-foot">built for the PayBox hackathon</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // iris open from the ≠ of the proof card
        tl.fromTo("#o-iris", { clipPath: "circle(0px at 540px 940px)" }, { clipPath: "circle(1400px at 540px 940px)", duration: 0.7, ease: "power3.in" }, 0);
        tl.fromTo("#o-glow", { scale: 0.9, x: 0 }, { scale: 1.2, x: 60, duration: 12, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

        // O1: Solana is just the start.
        tl.fromTo("#o-h1 .w", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out", stagger: 0.3 }, 0.45);
        tl.to("#o-h1", { y: -120, opacity: 0, duration: 0.3, ease: "power2.in" }, 2.35);

        // O2: one private balance
        tl.fromTo("#o-h2 .w", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "expo.out", stagger: 0.25 }, 2.6);
        tl.fromTo("#bal", { y: 80, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 3.2);
        tl.fromTo("#bal .shine i", { x: 0 }, { x: 1300, duration: 0.9, ease: "power2.inOut" }, 3.6);
        const n = { v: 0 };
        tl.fromTo(n, { v: 0 }, { v: 12480, duration: 0.9, ease: "power3.out",
          onUpdate: () => { document.querySelector("#bal-n").textContent = n.v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); } }, 3.4);
        tl.fromTo("#bal .only", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.3);
        tl.fromTo("#o-h2b", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 6.2);
        // O3: the chains, one per name
        [7.55, 8.25, 9.0, 9.7, 10.35, 10.9, 11.55].forEach((at, i) => {
          tl.fromTo("#chains .chip:nth-child(" + (i + 1) + ")", { y: 30, scale: 0.6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, at);
        });
        tl.fromTo("#bal", { y: 0 }, { y: -16, duration: 8, ease: "none", immediateRender: false }, 4.0);

        // O4: payroll. The balance scene clears up and out
        tl.to("#o-h2, #bal, #o-h2b, #chains", { y: -200, opacity: 0, duration: 0.35, ease: "power3.in", stagger: 0.04 }, 12.4);
        tl.fromTo("#o-h3 .w", { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "expo.out", stagger: 0.25 }, 12.8);
        tl.fromTo("#pay", { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "expo.out" }, 12.95);
        [0, 1, 2, 3, 4].forEach((i) => {
          tl.fromTo("#p" + i, { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power3.out" }, 13.2 + i * 0.4);
          tl.fromTo("#p" + i + " .ok", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2.5)" }, 16.5 + i * 0.12);
        });
        tl.fromTo("#more", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 15.25);
        tl.fromTo("#run", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, 15.6);
        tl.to("#run", { y: 8, boxShadow: "0 2px 0 #6c4fd6, 0 0 90px rgba(155,123,255,0.8)", duration: 0.1, ease: "power2.in" }, 16.3);
        tl.to("#run", { y: 0, boxShadow: "0 10px 0 #6c4fd6, 0 0 60px rgba(155,123,255,0.5)", duration: 0.25, ease: "back.out(3)" }, 16.42);
        tl.fromTo("#run-note", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 17.0);

        // O5: lockup. The bars and the redaction crossbar lock, same as the open
        tl.to("#o-h3, #pay, #run, #run-note", { opacity: 0, scale: 0.94, duration: 0.3, ease: "power2.in" }, 19.0);
        tl.fromTo("#ol-mark i.l", { y: -280, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 19.2);
        tl.fromTo("#ol-mark i.r", { y: 280, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 19.28);
        tl.fromTo("#ol-mark b", { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power4.out" }, 19.45);
        tl.fromTo("#ol-word", { y: 50, opacity: 0, scale: 1.12 }, { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, 19.55);
        tl.fromTo("#ol-tag", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 20.3);
        tl.fromTo("#ol-chip", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 20.8);
        tl.fromTo("#ol-foot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 21.2);
        tl.fromTo("#o-lock", { scale: 1 }, { scale: 1.05, duration: 4.6, ease: "none" }, 19.4);
        tl.fromTo("#ol-mark b", { boxShadow: "0 0 44px rgba(155,123,255,0.75)" }, { boxShadow: "0 0 90px rgba(155,123,255,1)", duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 20.2);

        window.__timelines["outro"] = tl;
      </script>
    </template>
  </body>
</html>
